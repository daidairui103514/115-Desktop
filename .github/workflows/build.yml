name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend deps
        run: npm install --no-audit --no-fund

      - name: generate app icons
        run: npx --no-install tauri icon app-icon.svg -o src-tauri/icons

      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('115 Desktop {0}', github.ref_name) || '' }}
          releaseBody: "两种用法：setup.exe 是安装版；portable.zip 解压即用，不写注册表，数据全在程序目录下。"
          releaseDraft: false
          prerelease: false

      # 便携版：把裸 exe 打成 zip，解压即用，缓存全在 exe 同级的 data 目录
      - name: package portable zip
        shell: pwsh
        run: |
          $src = "src-tauri/target/release/desktop115.exe"
          if (-not (Test-Path $src)) { throw "找不到 $src" }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $src "portable/115 Desktop.exe"
          Compress-Archive -Path "portable/115 Desktop.exe" -DestinationPath "115-Desktop-portable.zip" -Force

      - name: attach portable to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload ${{ github.ref_name }} "115-Desktop-portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: 115-desktop-windows-x64
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/desktop115.exe
            115-Desktop-portable.zip
