name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend deps
        run: npm install --no-audit --no-fund

      - name: generate app icons
        run: npx --no-install tauri icon app-icon.svg -o src-tauri/icons

      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('115 Desktop {0}', github.ref_name) || '' }}
          releaseBody: "下载下方 setup.exe 安装即可；也可下载 desktop115.exe 免安装直接运行。"
          releaseDraft: false
          prerelease: false

      - name: upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: 115-desktop-windows-x64
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/desktop115.exe
