name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend deps
        run: npm install --no-audit --no-fund

      - name: generate app icons
        run: npx --no-install tauri icon app-icon.svg -o src-tauri/icons

      # tag 是什么版本，安装包就是什么版本
      - name: sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "syncing version -> $v"
          (Get-Content package.json -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$v`"" | Set-Content package.json -Encoding UTF8 -NoNewline
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$v`"" | Set-Content src-tauri/Cargo.toml -Encoding UTF8 -NoNewline
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$v`"" | Set-Content src-tauri/tauri.conf.json -Encoding UTF8 -NoNewline
          Write-Host "package.json  -> $((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          Write-Host "Cargo.toml    -> $((Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value)"

      - name: build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('115 Desktop {0}', github.ref_name) || '' }}
          releaseBody: "两种用法：setup.exe 是安装版；portable.zip 解压即用，不写注册表，数据全在程序目录下。"
          releaseDraft: false
          prerelease: false

      # 便携版：整个文件夹打包，解压后是「115 Desktop」目录
      - name: package portable zip
        shell: pwsh
        run: |
          $src = "src-tauri/target/release/desktop115.exe"
          if (-not (Test-Path $src)) { throw "找不到 $src" }
          $root = "portable/115 Desktop"
          New-Item -ItemType Directory -Force -Path "$root/data" | Out-Null
          Copy-Item $src "$root/115 Desktop.exe"
          @"
          115 Desktop 便携版
          ==================

          双击「115 Desktop.exe」直接运行，不需要安装。

          data 目录
          ---------
          首次运行后会自动写入：
            data/EBWebView/     浏览器内核缓存
            data/session.json   登录令牌
            downloads/          默认下载位置

          所有数据都在这个文件夹里，不写注册表，不碰系统盘的其他目录。
          换电脑：整个「115 Desktop」文件夹拷走即可。
          不用了：直接删掉这个文件夹，就算卸载完成。
          "@ | Set-Content -Path "$root/使用说明.txt" -Encoding UTF8
          Compress-Archive -Path $root -DestinationPath "115-Desktop-portable.zip" -Force

      - name: attach portable to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload ${{ github.ref_name }} "115-Desktop-portable.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: 115-desktop-windows-x64
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/desktop115.exe
            115-Desktop-portable.zip
